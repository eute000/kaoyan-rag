<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>考研资料问答 · RAG Demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --line: #262c36;
    --text: #e6e9ef;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --ok: #35c48a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .status { font-size: 12px; color: var(--muted); }
  .status b { color: var(--ok); font-weight: 500; }
  main {
    flex: 1; width: min(880px, 100%); margin: 0 auto; padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .msg { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--panel); }
  .msg.user { background: #182131; border-color: #24344d; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .cite { color: var(--accent); font-weight: 600; }
  .sources { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .sources summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .hit { margin: 10px 0; font-size: 13px; }
  .hit .meta { color: var(--accent); }
  .hit .text { color: var(--muted); margin-top: 4px; }
  form {
    position: sticky; bottom: 0; background: var(--bg);
    display: flex; gap: 10px; padding: 16px 24px 24px; width: min(880px, 100%); margin: 0 auto;
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px; border-radius: 10px; border: 0; background: var(--accent);
    color: #fff; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>考研资料问答 · RAG</h1>
  <div class="status" id="status">加载中…</div>
</header>

<main id="chat">
  <div class="msg">
    <div class="role">提示</div>
    <div class="body">问一句考研资料里的问题，答案会带 [编号] 引用，展开“参考资料”能看到原文出处和检索得分。</div>
  </div>
</main>

<form id="ask">
  <input id="q" type="text" placeholder="例如：对立统一规律的核心是什么？" autocomplete="off" />
  <button id="send" type="submit">提问</button>
</form>

<script>
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');

fetch('/api/stats').then(r => r.json()).then(s => {
  statusEl.innerHTML = `语料 <b>${s.chunks}</b> 块 · 稠密检索 <b>${s.dense ? '开' : '关'}</b> · 模型 <b>${s.model}</b>${s.llm ? '' : ' · <b style="color:#e8a33d">未配置 DEEPSEEK_API_KEY</b>'}`;
}).catch(() => { statusEl.textContent = '接口异常'; });

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg' + (role === '你' ? ' user' : '');
  div.innerHTML = `<div class="role">${role}</div><div class="body"></div>`;
  div.querySelector('.body').textContent = text || '';
  chat.appendChild(div);
  div.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return div.querySelector('.body');
}

function renderSources(container, hits) {
  if (!hits.length) return;
  const box = document.createElement('div');
  box.className = 'sources';
  const items = hits.map(h => `
    <div class="hit">
      <div class="meta">[${h.n}] ${h.source} · ${h.section} · score ${h.score}</div>
      <div class="text">${h.text.replace(/</g, '&lt;')}…</div>
    </div>`).join('');
  box.innerHTML = `<details><summary>参考资料（${hits.length}）</summary>${items}</details>`;
  container.parentElement.appendChild(box);
}

function renderAnswer(text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
}

document.getElementById('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('q');
  const btn = document.getElementById('send');
  const question = input.value.trim();
  if (!question) return;

  addMsg('你', question);
  input.value = '';
  btn.disabled = true;
  const body = addMsg('助手', '');
  body.textContent = '检索中…';

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, k: 5 }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let answer = '';
    let first = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();
      for (const block of blocks) {
        const evMatch = block.match(/^event: (.+)$/m);
        const dataMatch = block.match(/^data: (.+)$/m);
        if (!evMatch || !dataMatch) continue;
        const data = JSON.parse(dataMatch[1]);
        if (evMatch[1] === 'sources') {
          renderSources(body, data.hits);
        } else if (evMatch[1] === 'token') {
          if (first) { body.textContent = ''; first = false; }
          answer += data.text;
          body.innerHTML = renderAnswer(answer);
          body.parentElement.scrollIntoView({ block: 'end' });
        }
      }
    }
  } catch (err) {
    body.textContent = '出错了：' + err.message;
  } finally {
    btn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
